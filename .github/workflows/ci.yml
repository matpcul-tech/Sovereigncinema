name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the run already in flight for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall runs `prisma generate`, which reads the schema only and
      # needs no DATABASE_URL. Nothing here reaches the database or fal or
      # Anthropic, so the job runs without any secrets.
      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run build
